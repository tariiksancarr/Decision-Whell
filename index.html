<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karar Çarkı 🎡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="lang-container">
    <button id="dilDegistirBtn" class="lang-btn">EN</button>
    <button id="sesToggleBtn" class="lang-btn audio-btn">
        <span class="speaker-icon">🔊</span>
        <span class="line-strike"></span>
    </button>
</div>


    <h2 id="mainTitle">Karar Çarkı 🎡</h2>
    
    <div class="input-group" id="inputContainer">
      <div class="input-wrapper">
        <input type="text" class="option-input" placeholder="Seçenek 1 (Örn: Ders Çalışmak)">
      </div>
      <div class="input-wrapper">
        <input type="text" class="option-input" placeholder="Seçenek 2 (Örn: Film İzlemek)">
      </div>
    </div>

    <div class="btn-group">
      <button id="addOptionBtn">➕ Seçenek Ekle</button>
      <button id="kararverbtn">Çarkı Döndür 🚀</button>
    </div>
    
    <div class="wheel-box">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <p id="sonucYazisi"></p>
    <div class="watermark">BY TARIK SANCAR</div>
    <audio id="audio" src="music.mp3"></audio>

  </div>
  
  <script src="script.js"></script>
</body>
</html>
